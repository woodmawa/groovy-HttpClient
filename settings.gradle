
/*
 * Gradle 9 settings for groovy-HttpClient.
 * Versions live in gradle/libs.versions.toml (the default catalog, picked up automatically).
 */
pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    // D-8: Central only. mavenLocal() could let a stale or tampered local artifact shadow Central in a release build.
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'groovy-HttpClient'
