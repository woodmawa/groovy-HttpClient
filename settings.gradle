
/*
 * Gradle 9 settings for groovy-HttpClient.
 * Versions live in gradle/libs.versions.toml (the default catalog, picked up automatically).
 */
pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        mavenCentral()
        mavenLocal()
    }
}

rootProject.name = 'groovy-HttpClient'
