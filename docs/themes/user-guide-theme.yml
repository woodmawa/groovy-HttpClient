# groovy-httpclient user guide -- asciidoctor-pdf theme (2.1)
# 10pt body text, compact code and tables, and chapters that flow on from each other:
# only parts start a new page, so short chapters no longer leave half-empty pages.
extends: default
page:
  size: A4
  margin: [18mm, 17mm, 20mm, 17mm]
base:
  font-size: 10
  line-height: 1.35
heading:
  margin-top: 14
  margin-bottom: 6
  h2-font-size: 17
  h3-font-size: 13
  h4-font-size: 11
  h5-font-size: 10
  chapter:
    break-before: auto
  part:
    break-before: always
code:
  font-size: 8.5
  line-height: 1.25
  padding: [6, 8, 6, 8]
codespan:
  font-size: 0.92em
table:
  font-size: 9
  cell-padding: [3, 4, 3, 4]
admonition:
  padding: [2, 8, 2, 8]
block:
  margin-bottom: 8
prose:
  margin-bottom: 7
list:
  item-spacing: 3
toc:
  font-size: 9.5
  line-height: 1.3
