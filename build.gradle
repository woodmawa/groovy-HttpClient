plugins {
    id 'groovy'
    id 'maven-publish'
    id 'signing'
    alias(libs.plugins.asciidoctor.convert)
    alias(libs.plugins.asciidoctor.pdf)
    // Nexus publish plugin for Maven Central
    alias(libs.plugins.nexus.publish)
}

// Toolchain policy (2.0.0):
//   - build and test on JDK 27 (HTTP/3 in java.net.http needs JDK 26+, JEP 517)
//   - emit Java 25 bytecode: the consumer floor is the current LTS
//   - testJava25 re-runs the suite on a JDK 25 runtime, so the floor is proven, not just declared
def buildJdk    = 27
def bytecodeJdk = 25

group = 'io.github.woodmawa'  // Or 'io.github.woodmawa' if using GitHub-based group
version = '2.0.0-SNAPSHOT'  // 2.0.0: Groovy 6, Java 25 floor, security behaviour changes (see docs/reviews)

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(buildJdk)
    }

    // Required for Maven Central
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    implementation libs.groovy
    implementation libs.groovy.json
    implementation libs.groovy.xml
    implementation libs.slf4j.api
    // D-1: a library must not pick the logging backend for its consumers
    testImplementation libs.logback.classic   // tests capture log output with ListAppender

    testImplementation libs.spock.core
    testImplementation platform(libs.junit.bom)
    testRuntimeOnly libs.junit.launcher
    testImplementation libs.junit.jupiter
    testImplementation libs.bytebuddy

    testImplementation libs.jetty.server
    testImplementation libs.jetty.alpn.java
    testImplementation libs.jetty.http2.server
    testImplementation libs.jetty.http2.common
    testImplementation libs.jetty.ee10.servlet
}

tasks.withType(JavaCompile).configureEach {
    options.release = bytecodeJdk
}

tasks.withType(GroovyCompile).configureEach {
    sourceCompatibility = "$bytecodeJdk"
    targetCompatibility = "$bytecodeJdk"
}

test {
    useJUnitPlatform()
}

// Same suite on the consumer floor runtime
tasks.register('testJava25', Test) {
    description = "Runs the test suite on a JDK ${bytecodeJdk} runtime (the bytecode floor)."
    group = 'verification'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(bytecodeJdk)
    }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter test
}

tasks.named('check') {
    dependsOn 'testJava25'
}

// Javadoc configuration - required for Maven Central
javadoc {
    if(JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }
    // Suppress warnings for Groovy code
    options.addStringOption('Xdoclint:none', '-quiet')
}

// Groovydoc is automatically created by the groovy plugin
// Configure it instead of registering a new one
groovydoc {
    // Optional: customize groovydoc settings
    // docTitle = "Groovy HTTP Client API"
    // windowTitle = "Groovy HTTP Client API"
}

// Publishing configuration for Maven Central
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            // Artifact coordinates
            groupId = project.group
            artifactId = 'groovy-httpclient'  // Note: lowercase, no camelCase
            version = project.version

            // Required POM metadata for Maven Central
            pom {
                name = 'Groovy HTTP Client'
                description = 'A modern, production-ready HTTP client for Groovy and Java applications, built on Java HttpClient with virtual threads, comprehensive security controls, and powerful testing framework'
                url = 'https://github.com/woodmawa/groovy-HttpClient'

                // Required: Inception year
                inceptionYear = '2025'

                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }

                developers {
                    developer {
                        id = 'woodmawa'
                        name = 'William Woodman'
                        email = 'will.woodman.softwood@outlook.com'
                        organization = 'Softwood Consulting Ltd'
                        organizationUrl = 'https://github.com/woodmawa'
                    }
                }

                scm {
                    connection = 'scm:git:git://github.com/woodmawa/groovy-HttpClient.git'
                    developerConnection = 'scm:git:ssh://git@github.com/woodmawa/groovy-HttpClient.git'
                    url = 'https://github.com/woodmawa/groovy-HttpClient'
                }

                // Issue management
                issueManagement {
                    system = 'GitHub Issues'
                    url = 'https://github.com/woodmawa/groovy-HttpClient/issues'
                }
            }
        }
    }
}

// Signing configuration - required for Maven Central
signing {

    // 1. Only require signing for actual release tasks
    // Check inside the closure so it evaluates at the right time
    required = {
        gradle.taskGraph.hasTask("publishToSonatype") ||
                gradle.taskGraph.hasTask("publishToMavenCentral")
    }

    // 2. Modern GPG support (Optional but better for Gpg4win)
    // If you use this, you don't need the secretKeyRingFile property
    // useGpgCmd()

    // 3. Keep your current logic but ensure it points to the right publication
    def signingKey = findProperty("signing.keyId")
    def signingPassword = findProperty("signing.password")
    def signingSecretKeyRingFile = findProperty("signing.secretKeyRingFile")

    if (signingKey && signingPassword && signingSecretKeyRingFile) {
        sign publishing.publications.mavenJava
    }
}

// FORCE publishToMavenLocal to wait for the signing task
tasks.withType(PublishToMavenLocal) {
    dependsOn tasks.withType(Sign)
}

// Nexus publishing plugin configuration
nexusPublishing {
    repositories {
        sonatype {
            // New URL for the Central Portal Staging API
            nexusUrl.set(uri("https://ossrh-staging-api.central.sonatype.com/service/local/"))
            snapshotRepositoryUrl.set(uri("https://central.sonatype.com/repository/maven-snapshots/"))

            // Use your User Token credentials
            username = findProperty("ossrhUsername")
            password = findProperty("ossrhPassword")
        }
    }
    // Optional: Keeps the connection stable during the upload
    connectTimeout = Duration.ofMinutes(3)
    clientTimeout = Duration.ofMinutes(3)
}

// Asciidoctor configuration
asciidoctor {
    sourceDir = file('docs')
    sources {
        include 'index.adoc'
    }
    outputDir = file('build/docs/html5')

    // Set base directory so includes work
    baseDirFollowsSourceDir()

    attributes = [
            'source-highlighter': 'rouge',
            'toc': 'left',
            'toclevels': 3,
            'sectnums': '',
            'icons': 'font',
            'version': project.version
    ]
}

asciidoctorPdf {
    sourceDir = file('docs')
    sources {
        include 'index.adoc'
    }
    outputDir = file('build/docs/pdf')

    // Set base directory so includes work
    baseDirFollowsSourceDir()

    attributes = [
            'source-highlighter': 'rouge',
            'version': project.version,
            'backend': 'pdf'
    ]
}
