# Single source of truth for versions (2.0.0). Before this they sat in gradle.properties,
# a file .gitignore lists under "Build Secrets" -- it stayed tracked only because it was
# committed before the ignore rule. Signing / OSSRH credentials belong in ~/.gradle/gradle.properties.

[versions]
groovy        = "6.0.0"
spock         = "2.5-groovy-6.0"
junit         = "6.1.3"
bytebuddy     = "1.18.15"
jetty         = "12.1.14"
slf4j         = "2.0.20"
logback       = "1.6.5"
asciidoctor   = "4.0.5"
nexusPublish  = "2.0.0"
jackson       = "2.21.5"   # 2.x LTS line (com.fasterxml); 2.21.5 carries the @JsonView CVE fixes

[libraries]
groovy               = { module = "org.apache.groovy:groovy",      version.ref = "groovy" }
groovy-json          = { module = "org.apache.groovy:groovy-json", version.ref = "groovy" }
groovy-xml           = { module = "org.apache.groovy:groovy-xml",  version.ref = "groovy" }
slf4j-api            = { module = "org.slf4j:slf4j-api",           version.ref = "slf4j" }
logback-classic      = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
# Optional at runtime: compileOnly for the library, testImplementation for its specs (2.1 codec registry)
jackson-databind     = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }

spock-core           = { module = "org.spockframework:spock-core", version.ref = "spock" }
junit-bom            = { module = "org.junit:junit-bom",           version.ref = "junit" }
junit-jupiter        = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher       = { module = "org.junit.platform:junit-platform-launcher" }
bytebuddy            = { module = "net.bytebuddy:byte-buddy",      version.ref = "bytebuddy" }

jetty-server         = { module = "org.eclipse.jetty:jetty-server",               version.ref = "jetty" }
jetty-alpn-java      = { module = "org.eclipse.jetty:jetty-alpn-java-server",     version.ref = "jetty" }
jetty-http2-server   = { module = "org.eclipse.jetty.http2:jetty-http2-server",   version.ref = "jetty" }
jetty-http2-common   = { module = "org.eclipse.jetty.http2:jetty-http2-common",   version.ref = "jetty" }
jetty-ee10-servlet   = { module = "org.eclipse.jetty.ee10:jetty-ee10-servlet",    version.ref = "jetty" }
# HTTP/3 test server (QUIC via Cloudflare quiche, FFM binding)
jetty-http3-server   = { module = "org.eclipse.jetty.http3:jetty-http3-server",   version.ref = "jetty" }
jetty-quiche-server  = { module = "org.eclipse.jetty.quic:jetty-quic-quiche-server", version.ref = "jetty" }
jetty-quiche-foreign = { module = "org.eclipse.jetty.quic:jetty-quic-quiche-foreign", version.ref = "jetty" }

[plugins]
asciidoctor-convert  = { id = "org.asciidoctor.jvm.convert",          version.ref = "asciidoctor" }
asciidoctor-pdf      = { id = "org.asciidoctor.jvm.pdf",              version.ref = "asciidoctor" }
nexus-publish        = { id = "io.github.gradle-nexus.publish-plugin", version.ref = "nexusPublish" }
