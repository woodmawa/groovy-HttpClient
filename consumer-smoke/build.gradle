plugins {
    id 'groovy'
}

def libVersion = providers.gradleProperty('libVersion').get()
def testRepo = providers.gradleProperty('testRepo').get()

repositories {
    maven { url = uri(new File(testRepo)) }
    mavenCentral()
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

dependencies {
    implementation "io.github.woodmawa:groovy-httpclient:${libVersion}"
    testImplementation testFixtures("io.github.woodmawa:groovy-httpclient:${libVersion}")
    testImplementation 'org.spockframework:spock-core:2.5-groovy-6.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
}

test {
    useJUnitPlatform()
    systemProperty 'libVersion', libVersion
    systemProperty 'testRepo', testRepo
    testLogging { events 'passed', 'failed'; exceptionFormat = 'full' }
}
